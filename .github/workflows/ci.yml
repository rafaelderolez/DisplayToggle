name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          for script in build.sh scripts/*.sh 'Build DisplayToggle.command'; do
            bash -n "$script"
          done
      - name: Build universal test archive
        run: ./scripts/release.sh --unsigned
      - name: Verify packaged app
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          cd dist
          shasum -a 256 -c "DisplayToggle-$version-unsigned.zip.sha256"
          ditto -x -k "DisplayToggle-$version-unsigned.zip" unpacked
          app="unpacked/DisplayToggle.app"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --strict "$app"
          xcrun lipo "$app/Contents/MacOS/DisplayToggle" -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = '13.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = AppIcon
          test -s "$app/Contents/Resources/AppIcon.icns"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DisplayToggle-unsigned-test-build
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
